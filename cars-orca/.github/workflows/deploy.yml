name: Deploy Cars Orca

on:
  push:
    branches:
      - main
  schedule:
    # Runs at 4:30 AM UTC on May 2nd (today at 10:00 AM IST).
    - cron: '30 4 2 5 *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Executing remote ssh commands using ssh key
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          # TODO: Please update the directory path to your actual Cars Orca directory on the server
          cd /var/www/f6810204-9b35-4d33-9ea4-e6a9ac482b72/carsorca.com 
          
          git fetch origin
          git reset --hard origin/main
          
          # Optional Laravel deployment commands (uncomment if needed):
          # composer install --no-interaction --prefer-dist --optimize-autoloader
          # php artisan migrate --force
          # php artisan config:cache
          # php artisan route:cache
          # php artisan view:cache
